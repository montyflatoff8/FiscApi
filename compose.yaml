services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-22.04
    container_name: fiscapi-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Read from .env (git-ignored). Compose refuses to start if it's missing.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Required. Copy .env.example to .env and set a password.}
    ports:
      # 127.0.0.1 = only this PC can connect. 14334 avoids clashing with the class horse container (14333).
      - "127.0.0.1:14334:1433"
    volumes:
      - fiscapi-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  fiscapi-sql-data:
